name: Test and deploy to GitHub Pages

# Every push to main runs the cost-engine tests and, if they pass, publishes
# the app. The published URL is what makes the phone work without the laptop.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # No setup-node step: the runner's Node is fine, because the tests have
      # no dependencies and use only node:assert (ADR-0003).
      - name: Run tests
        run: npm test

      # ONE-TIME SETUP, required before the first successful deploy:
      #   repo → Settings → Pages → Source: "GitHub Actions"
      #
      # `enablement: true` was tried here and fails with "Resource not
      # accessible by integration" — the default workflow token is not allowed
      # to create a Pages site. Left off so this step reports the real state
      # instead of a permissions error that hides it.
      - uses: actions/configure-pages@v5

      # Stage only the app. docs/, decisions/ and tasks/ stay in the repo where
      # they are readable on GitHub, rather than being served as a website.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r app _site/
          if [ -d media ]; then cp -r media _site/; fi
          ls -R _site | head -40

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
