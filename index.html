<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <meta name="description" content="Map-first tracker for PG hunting: pins, descriptions, photos, videos and the true monthly cost of every option.">
  <meta name="color-scheme" content="light dark">
  <title>point map — PG & place tracker</title>
  <link rel="icon" href="app/icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="app/icons/apple-touch-icon.png">

  <!-- Installable on a phone home screen; works with no signal. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#1d4ed8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="point map">
  <link rel="stylesheet" href="app/styles/base.css">
  <link rel="stylesheet" href="app/styles/components.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar__brand">
        <span class="topbar__logo" aria-hidden="true">📍</span>
        <span class="topbar__name">point map</span>
      </div>

      <nav class="tabs" id="tabs" aria-label="Views">
        <button class="tab is-active" type="button" data-view="map">Map</button>
        <button class="tab" type="button" data-view="compare">
          Compare<span class="badge" id="compare-badge" hidden></span>
        </button>
        <button class="tab" type="button" data-view="money">Money</button>
      </nav>

      <div class="topbar__right">
        <span class="chip chip--warn" id="offline-chip" title="No connection — your data is safe, only map tiles are affected" hidden>offline</span>
        <button class="chip chip--quiet" type="button" id="install-btn" title="Install to your home screen" hidden>⤓ Install</button>
        <span class="chip chip--quiet" id="provider-chip" title="Which map is being used"></span>
        <button class="chip chip--quiet" type="button" id="backup-chip"></button>
        <button class="btn btn--primary" type="button" id="add-btn" title="Add a location (N)">
          + Add
        </button>
      </div>
    </header>

    <main class="workspace" id="workspace">
      <aside class="sidebar" id="sidebar" aria-label="Locations"></aside>

      <section class="stage">
        <div class="map" id="map" role="application" aria-label="Map of saved locations"></div>
        <div class="map-hint" id="map-hint" hidden></div>
        <div class="map-status" id="map-status"></div>
        <noscript>
          <p class="map-status">This app needs JavaScript — it is entirely a client-side tool.</p>
        </noscript>
      </section>

      <aside class="drawer" id="drawer" aria-label="Location details" hidden></aside>
    </main>

    <section class="view" id="view-compare" hidden></section>
    <section class="view" id="view-money" hidden></section>
  </div>

  <div id="modal-root"></div>
  <div class="toast-root" id="toast-root" aria-live="polite"></div>

  <script type="module" src="app/main.js"></script>
</body>
</html>
